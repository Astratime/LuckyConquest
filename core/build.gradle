[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  // Ashley (ECS), Box2D/Bullet (physique 2D/3D), Box2DLights, gdx-ai et
  // gdx-controllers ont été retirés : aucune classe du jeu n'en dépend
  // (vérifié par recherche dans tout le code source).
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }

  testImplementation platform("org.junit:junit-bom:$junitVersion")
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

test {
  useJUnitPlatform()
}

// Simulateur d'équilibrage : ./gradlew :core:simulate (rapport dans core/build/simulation/equilibrage.md),
// -Pquick pour un essai rapide.
tasks.register('simulate', JavaExec) {
  group = 'verification'
  description = "Simule des milliers de tours et écrit le rapport d'équilibrage."
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'fr.astratime.lucky.sim.BalanceSimulator'
  jvmArgs '-Dstdout.encoding=UTF-8', '-Dfile.encoding=UTF-8'
  systemProperty 'lucky.assets', rootProject.file('assets').absolutePath
  systemProperty 'lucky.simulation.out', layout.buildDirectory.file('simulation/equilibrage.md').get().asFile.absolutePath
  if (project.hasProperty('quick')) args '--quick'
}
