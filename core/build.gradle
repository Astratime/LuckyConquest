[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  // Ashley (ECS), Box2D/Bullet (physique 2D/3D), Box2DLights, gdx-ai et
  // gdx-controllers ont été retirés : aucune classe du jeu n'en dépend
  // (vérifié par recherche dans tout le code source).
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }

  testImplementation platform("org.junit:junit-bom:$junitVersion")
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

test {
  useJUnitPlatform()
}

// Simulateur d'équilibrage : ./gradlew :core:simulate (rapport dans core/build/simulation/equilibrage.md),
// -Pquick pour un essai rapide.
tasks.register('simulate', JavaExec) {
  group = 'verification'
  description = "Simule des milliers de tours et écrit le rapport d'équilibrage."
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'fr.astratime.lucky.sim.BalanceSimulator'
  jvmArgs '-Dstdout.encoding=UTF-8', '-Dfile.encoding=UTF-8'
  systemProperty 'lucky.assets', rootProject.file('assets').absolutePath
  systemProperty 'lucky.simulation.out', layout.buildDirectory.file('simulation/equilibrage.md').get().asFile.absolutePath
  if (project.hasProperty('quick')) args '--quick'
  if (project.hasProperty('tower')) args '--tower'
  if (project.hasProperty('stake')) systemProperty 'lucky.stake', project.property('stake')
  if (project.hasProperty('potPerRun')) systemProperty 'lucky.potPerRun', 'true'
}

// Dégâts des quatre suites : ./gradlew :core:simulateSuits (-Pquick pour un essai rapide).
tasks.register('simulateSuits', JavaExec) {
  group = 'verification'
  description = "Compare les dégâts d'un deck de chaque suite (Pique, Coeur, Trèfle, Carreau)."
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'fr.astratime.lucky.sim.SuitStraightSimulator'
  jvmArgs '-Dstdout.encoding=UTF-8', '-Dfile.encoding=UTF-8'
  systemProperty 'lucky.assets', rootProject.file('assets').absolutePath
  if (project.hasProperty('quick')) args '--quick'
}

// Images des cartes propres des ennemis : ./gradlew :core:enemyCards (dans assets/cards/dark/sig/).
tasks.register('enemyCards', JavaExec) {
  group = 'assets'
  description = "Dessine les cartes propres des ennemis."
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'fr.astratime.lucky.assets.EnemyCardArt'
  systemProperty 'lucky.assets', rootProject.file('assets').absolutePath
  systemProperty 'java.awt.headless', 'true'
}

// Numéro de version du jeu (projectVersion de gradle.properties), écrit dans une
// classe générée : le menu l'affiche et le rapport de plantage le note en tête.
def versionSourceDir = layout.buildDirectory.dir('generated/sources/version/java')
def generateVersionSource = tasks.register('generateVersionSource') {
  group = 'build'
  description = 'Écrit fr.astratime.lucky.GameVersion avec le numéro de version du jeu.'
  def gameVersion = projectVersion.toString()
  inputs.property('gameVersion', gameVersion)
  outputs.dir(versionSourceDir)
  doLast {
    def file = versionSourceDir.get().file('fr/astratime/lucky/GameVersion.java').asFile
    file.parentFile.mkdirs()
    file.setText("""package fr.astratime.lucky;

/** Numéro de version du jeu : classe générée par Gradle depuis projectVersion (gradle.properties). */
public final class GameVersion {
    /** Version du jeu, par exemple {@code 1.0.0}. */
    public static final String VERSION = "${gameVersion}";

    private GameVersion() {}
}
""", 'UTF-8')
  }
}
sourceSets.main.java.srcDir(generateVersionSource)
