name: Exécutables

# Fabrique le jeu pour Windows, Mac et Linux (chaque zip contient son propre
# Java : rien à installer pour jouer).
#  - Lancement à la main (onglet Actions > Exécutables > Run workflow) :
#    les zips sont à télécharger en bas de la page de l'exécution.
#  - Tag « v* » poussé (ex : v1.0.0) : les zips sont en plus publiés dans
#    une Release GitHub, dont le lien peut être partagé.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { target: WinX64,   name: Windows,     file: windows }
          - { target: MacM1,    name: Mac M1-M4,   file: mac-apple-silicon }
          - { target: MacX64,   name: Mac Intel,   file: mac-intel }
          - { target: LinuxX64, name: Linux,       file: linux }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Fabrication
        run: ./gradlew :lwjgl3:package${{ matrix.target }}

      - name: Renommage
        run: mv lwjgl3/build/construo/dist/*.zip "LuckyConquest-${{ matrix.file }}.zip"

      # Sans ré-archivage : le zip se télécharge tel quel depuis la page de l'exécution.
      - uses: actions/upload-artifact@v7
        with:
          path: LuckyConquest-${{ matrix.file }}.zip
          archive: false

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: LuckyConquest-*
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.zip
          generate_release_notes: true
